name: Build ARS DJ APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build and diagnose errors
        shell: bash
        run: |
          set +e
          gradle --no-daemon assembleDebug --stacktrace --info > build.log 2>&1
          result=$?

          echo "========== ERROR SUMMARY =========="
          grep -ni -B 5 -A 12 -E \
            'What went wrong|^e: |error:|FAILURE:|Caused by:|Manifest merger failed|Android resource linking failed|Could not resolve|Compilation error' \
            build.log | tail -n 180 || true

          echo "========== LAST 100 LOG LINES =========="
          tail -n 100 build.log

          exit "$result"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ARS-DJ-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
